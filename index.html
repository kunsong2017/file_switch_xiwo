<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f5" />
    <meta name="description" content="题页：将 PDF、Word 试卷按题目拆分，每题一页导出 PowerPoint。文件在浏览器本地处理。" />
    <title>题页 · 试卷转 PPT</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <section style="max-width:640px;margin:12vh auto;padding:32px;font:16px/1.9 system-ui,sans-serif;color:#35452c;background:#f5f8ee;border:1px solid #dce6cd;border-radius:14px">
        <h1 id="startup-title" style="font-size:24px;margin:0 0 16px">正在打开题页…</h1>
        <p>直接打开本文件时会自动进入 <code>offline/index.html</code> 免安装离线版；也可以手动打开该文件，无需 Python。</p>
        <p>以下启动方式仅供开发者运行普通网页服务版：</p>
        <p><strong>Windows：</strong>双击「启动题页.bat」。<br><strong>macOS / Linux：</strong>在终端运行 <code>sh ./启动题页.sh</code>。</p>
        <p>启动需要 Python 3.8 或更新版本。请保持启动窗口开启，在浏览器中访问窗口显示的本机网址。</p>
        <p>请先完整解压文件。详细步骤见「使用前先看.txt」。</p>
      </section>
    </div>
    <script>
      if (location.protocol === 'file:') {
        location.replace((location.pathname.endsWith('/dist/index.html') ? '../' : './') + 'offline/index.html');
      }
    </script>
    <div id="render-root" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
